# ─── Nginx Config para el WebSocket Server ───────────────────────────────────
# Agrega esto dentro de tu server block SSL existente en /etc/nginx/sites-available/tu-dominio

# Dentro del bloque: server { listen 443 ssl; ... }

    # REST API del servidor de voz
    location /ws-voice/ {
        proxy_pass http://localhost:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket de Telnyx Media Streaming
    location /media {
        proxy_pass http://localhost:3001/media;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;      # 1 hora (llamadas largas)
        proxy_send_timeout 3600s;
        proxy_buffering off;           # CRÍTICO: no buffear WebSocket
    }

# ─── Comandos para aplicar ────────────────────────────────────────────────────
# sudo nginx -t                    → verificar sintaxis
# sudo systemctl reload nginx      → aplicar sin cortar conexiones
